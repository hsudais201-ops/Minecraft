name: Prepare Vanilla Minecraft Java 1.21.11 Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prepare-runtime.yml"
      - "scripts/download-server.sh"

permissions:
  contents: read

jobs:
  prepare:
    name: Download and verify official vanilla server software
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check downloader syntax and dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/download-server.sh
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          command -v curl
          command -v sha1sum
          jq --version

      - name: Download official vanilla Minecraft Java 1.21.11
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/download-server.sh bundle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Smoke-test the vanilla server without accepting the EULA
        shell: bash
        run: |
          set -euo pipefail
          cd bundle
          set +e
          timeout 60s java -Xms256M -Xmx1G -jar server.jar --nogui > ../vanilla-smoke.log 2>&1
          status=$?
          set -e
          cat ../vanilla-smoke.log
          if [[ "$status" -eq 124 ]]; then
            echo "Minecraft did not reach the EULA gate within 60 seconds." >&2
            exit 1
          fi
          grep -Eiq 'agree to the EULA' ../vanilla-smoke.log
          echo "Official vanilla Minecraft Java 1.21.11 executed under Java 21 and stopped at the EULA gate."

      - name: Write checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s bundle/server.jar
          (cd bundle && sha1sum server.jar > SHA1SUMS)
          cat bundle/SHA1SUMS

      - name: Upload temporary vanilla server bundle
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-vanilla-java-1.21.11
          path: |
            bundle/server.jar
            bundle/server.properties
            bundle/eula.txt
            bundle/SHA1SUMS
          if-no-files-found: error
          retention-days: 3
