name: Prepare Minecraft Java 1.21.11 Runtime

on:
  workflow_dispatch:
    inputs:
      minecraft-version:
        description: "Paper Java Edition version"
        required: true
        default: "1.21.11"
        type: string
  push:
    paths:
      - ".github/workflows/prepare-runtime.yml"
      - "scripts/download-server.sh"

permissions:
  contents: read

jobs:
  prepare:
    name: Download and verify Paper Java server software
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check downloader syntax and dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/download-server.sh
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          command -v curl
          command -v sha256sum
          jq --version

      - name: Download Paper Java server
        shell: bash
        env:
          MC_VERSION: ${{ inputs.minecraft-version || '1.21.11' }}
        run: |
          set -euo pipefail
          bash scripts/download-server.sh "$MC_VERSION" bundle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Smoke-test Paper without accepting the EULA
        shell: bash
        run: |
          set -euo pipefail
          cd bundle
          set +e
          timeout 60s java -Xms256M -Xmx1G -jar paper.jar --nogui > ../paper-smoke.log 2>&1
          status=$?
          set -e
          cat ../paper-smoke.log
          if [[ "$status" -eq 124 ]]; then
            echo "Paper did not reach the EULA gate within 60 seconds." >&2
            exit 1
          fi
          grep -Eiq 'EULA|agree to the.*(license|agreement)' ../paper-smoke.log
          echo "Paper executed under Java 21 and stopped at the EULA gate."

      - name: Write checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s bundle/paper.jar
          (cd bundle && sha256sum paper.jar > SHA256SUMS)
          cat bundle/SHA256SUMS

      - name: Upload temporary Java server bundle
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-java-runtime-${{ inputs.minecraft-version || '1.21.11' }}
          path: |
            bundle/paper.jar
            bundle/server.properties
            bundle/eula.txt
            bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
