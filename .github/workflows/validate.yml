name: Validate server project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate server configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f config/server.properties
          grep -qx 'gamemode=survival' config/server.properties
          grep -qx 'online-mode=true' config/server.properties
          grep -qx 'white-list=true' config/server.properties
          grep -qx 'enforce-whitelist=true' config/server.properties
          echo "Server configuration checks passed."

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/check-config.sh
          bash -n scripts/download-server.sh
          bash -n scripts/start-server.sh
          echo "Shell script syntax checks passed."

      - name: Check EULA safety
        shell: bash
        run: |
          set -euo pipefail
          # Reject common commands that would write eula=true to a file.
          if grep -Eq '(printf|echo)[[:space:]].*eula=true.*(>|>>) ' scripts/*.sh; then
            echo "Safety check failed: a script appears to auto-accept the EULA." >&2
            exit 1
          fi
          echo "EULA safety check passed."
